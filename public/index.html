<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLBB Accounts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <path d="M20 2L4 10V20C4 30 12 38 20 40C28 38 36 30 36 20V10L20 2Z" fill="url(#logoGrad)"/>
                        <path d="M14 15L20 10L26 15V22L20 27L14 22V15Z" fill="#fff" opacity="0.9"/>
                        <defs>
                            <linearGradient id="logoGrad" x1="4" y1="2" x2="36" y2="40">
                                <stop stop-color="#8B5CF6"/>
                                <stop offset="1" stop-color="#6D28D9"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="logo-text">
                        <div class="logo-title">MLBB ACCOUNTS</div>
                        <div class="logo-subtitle">МАГАЗИН АККАУНТОВ MOBILE LEGENDS</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- ТАБЫ: ПРОДАЖА / УСЛУГИ -->
        <div class="tabs">
            <button class="tab active" data-tab="sale" onclick="switchTab('sale')">🛒 Продажа</button>
            <button class="tab" data-tab="services" onclick="switchTab('services')">🎯 Услуги</button>
        </div>

        <!-- РАЗДЕЛ ПРОДАЖИ -->
        <div id="saleSection">
            <!-- Поиск и фильтры -->
            <div class="search-section">
                <div class="search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Поиск по аккаунтам...">
                </div>
                <button class="filter-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                    </svg>
                    Фильтры
                </button>
            </div>

            <!-- Кнопка сортировки -->
            <button id="sortBtn" class="sort-btn" onclick="toggleSort()">
                <span id="sortText">Сортировка по цене</span>
                <span id="sortIcon">⇅</span>
            </button>

            <!-- КНОПКА ИНДИВИДУАЛЬНОГО ЗАКАЗА -->
            <button class="btn-custom-order" onclick="openCustomOrderModal()">
                🛠️ Индивидуальный заказ аккаунта
            </button>

            <!-- Кнопка админа -->
            <div class="admin-panel" id="adminPanel" style="display: none;">
                <button class="btn-add" onclick="openAddModal()">+ Добавить аккаунт</button>
            </div>

            <!-- Список аккаунтов -->
            <div class="accounts-list" id="accountsList"></div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">📭</div>
                <p>Пока нет аккаунтов</p>
            </div>
        </div>

        <!-- РАЗДЕЛ УСЛУГ -->
        <div id="servicesSection" style="display: none;">
            <div class="search-section">
                <div class="search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="servicesSearchInput" placeholder="Поиск по услугам...">
                </div>
            </div>

            <div class="admin-panel" id="adminPanelServices" style="display: none;">
                <button class="btn-add-service" onclick="openAddServiceModal()">+ Добавить услугу</button>
            </div>

            <div class="accounts-list" id="servicesList"></div>
            <div class="empty-state" id="servicesEmptyState" style="display: none;">
                <div class="empty-icon">🎯</div>
                <p>Пока нет услуг</p>
            </div>
        </div>
    </div>

    <!-- Модалка добавления аккаунта -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>Добавить аккаунт</h2>
            <form id="addForm">
                <div class="form-group">
                    <label>📸 Скриншот аккаунта</label>
                    <input type="file" id="photo" accept="image/*" onchange="previewImage(event)">
                    <div class="photo-preview" id="photoPreview"></div>
                </div>
                <div class="form-group">
                    <label>Название / Описание</label>
                    <textarea id="description" placeholder="17 КОЛЛ ✨ ФУЛЛ ЖЖК 🏠 3 ЛЕГИ..." required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Ранг</label>
                        <input type="text" id="rank" required placeholder="Мифический">
                    </div>
                    <div class="form-group">
                        <label>Цена (₽)</label>
                        <input type="number" id="price" required placeholder="25000">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Герои</label>
                        <input type="number" id="heroes" required placeholder="133">
                    </div>
                    <div class="form-group">
                        <label>Скины</label>
                        <input type="number" id="skins" required placeholder="500">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeAddModal()">Отмена</button>
                    <button type="submit" class="btn-submit">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модалка покупки -->
    <div class="modal" id="buyModal">
        <div class="modal-content buy-modal">
            <div id="buyDetails"></div>
            <div class="form-actions">
                <button class="btn-cancel" onclick="closeBuyModal()">Закрыть</button>
                <button class="btn-submit" onclick="contactSeller()">Связаться</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ИНДИВИДУАЛЬНОГО ЗАКАЗА -->
    <div id="customOrderModal" class="modal">
        <div class="modal-content custom-modal-content">
            <span class="close-modal" onclick="closeCustomOrderModal()" style="float: right; font-size: 28px; cursor: pointer; color: rgba(255,255,255,0.5);">&times;</span>
            <h2 class="modal-title" style="margin-top: 0; margin-bottom: 20px;">🛠️ Индивидуальный заказ</h2>
            
            <div class="form-group">
                <label class="form-label">Тип аккаунта:</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="accType" value="Пустышка" checked>
                        <span class="radio-custom">Пустышка</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="accType" value="Жирный">
                        <span class="radio-custom">Жирный</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="customStars">Количество звезд в максимальном ранге:</label>
                <input type="number" id="customStars" class="form-input" placeholder="Например: 50" min="0">
            </div>

            <div class="form-group">
                <label class="form-label" for="customWinRate">Процент побед (%):</label>
                <input type="number" id="customWinRate" class="form-input" placeholder="Например: 65" min="0" max="100">
            </div>

            <div class="form-group">
                <label class="form-label" for="customDescription">Краткое описание:</label>
                <textarea id="customDescription" class="form-input" placeholder="Например: Аккаунт для турниров, без банов, хороший ММР..." rows="3" style="resize: vertical; min-height: 80px;"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Желаемые скины:</label>
                <div id="skinsContainer">
                    <div class="skin-input-row">
                        <input type="text" class="form-input skin-input" placeholder="Название скина (например: Колл)">
                        <button type="button" class="remove-skin-btn" onclick="removeSkinField(this)">✕</button>
                    </div>
                </div>
                <button type="button" class="btn-add-skin" onclick="addSkinField()">+ Добавить еще скин</button>
            </div>

            <button class="btn-submit-order" onclick="submitCustomOrder()">📩 Отправить заявку продавцу</button>
        </div>
    </div>

    <!-- МОДАЛКА ДОБАВЛЕНИЯ УСЛУГИ -->
    <div class="modal" id="addServiceModal">
        <div class="modal-content">
            <h2>Добавить услугу</h2>
            <form id="addServiceForm">
                <div class="form-group">
                    <label>📸 Фото услуги</label>
                    <input type="file" id="servicePhoto" accept="image/*" onchange="previewServiceImage(event)">
                    <div class="photo-preview" id="servicePhotoPreview"></div>
                </div>
                <div class="form-group">
                    <label>Описание услуги</label>
                    <textarea id="serviceDescription" placeholder="Например: Прокачка ранга до Мифика за 3 дня..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Цена (₽)</label>
                    <input type="number" id="servicePrice" required placeholder="1500">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeAddServiceModal()">Отмена</button>
                    <button type="submit" class="btn-submit">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- МОДАЛКА ПРОСМОТРА УСЛУГИ -->
    <div class="modal" id="serviceModal">
        <div class="modal-content buy-modal">
            <div id="serviceDetails"></div>
            <div class="form-actions">
                <button class="btn-cancel" onclick="closeServiceModal()">Закрыть</button>
                <button class="btn-submit" onclick="contactSellerService()">Заказать</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
